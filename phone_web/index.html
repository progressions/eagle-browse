<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1115" />
  <title>Eagle Phone</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <button type="button" id="btn-nav" class="icon-btn" aria-label="Folders">☰</button>
    <div class="title-block">
      <div id="page-title" class="title">Eagle</div>
      <div id="status" class="status">Loading…</div>
    </div>
    <button type="button" id="btn-smart" class="icon-btn" aria-label="Smart folders">◈</button>
    <button type="button" id="btn-search" class="icon-btn" aria-label="Search">⌕</button>
  </header>

  <div id="chars" class="chars" role="tablist"></div>

  <div id="search-bar" class="search-bar hidden">
    <input id="search" type="search" placeholder="Name or tag…" autocomplete="off" enterkeyhint="search" />
    <button type="button" id="btn-clear-search" class="text-btn">Clear</button>
  </div>

  <div id="active-filters" class="chips"></div>

  <main id="grid" class="grid" aria-live="polite"></main>

  <div id="sentinel" class="sentinel"></div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>Browse</strong>
      <button type="button" id="btn-close-nav" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div class="drawer-section">
      <div class="section-label">Views</div>
      <nav id="view-list" class="folder-tree"></nav>
    </div>
    <div class="drawer-section">
      <div class="section-label">Smart folders</div>
      <button type="button" id="btn-smart-all" class="text-btn">Open full list…</button>
      <nav id="smart-tree" class="folder-tree"></nav>
    </div>
    <div class="drawer-section">
      <div class="section-label">Characters</div>
      <div id="drawer-chars" class="chip-row"></div>
    </div>
    <div class="drawer-section">
      <div class="section-label">Folders</div>
      <nav id="folder-tree" class="folder-tree"></nav>
    </div>
    <div class="drawer-section">
      <div class="section-label">Tags (top)</div>
      <div id="tag-list" class="chip-row wrap"></div>
    </div>
    <div class="drawer-section foot">
      <button type="button" id="btn-reload" class="text-btn">Reload index</button>
      <button type="button" id="btn-rebuild" class="text-btn">Rebuild index</button>
    </div>
  </aside>
  <div id="scrim" class="scrim hidden"></div>

  <div id="smart-picker" class="smart-picker hidden" role="dialog" aria-modal="true" aria-label="Smart folders">
    <div class="smart-picker-head">
      <strong>Smart folders</strong>
      <button type="button" id="btn-close-smart" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <input id="smart-filter" class="smart-filter" type="search" placeholder="Filter folders…" autocomplete="off" />
    <div id="smart-picker-views" class="smart-picker-views"></div>
    <nav id="smart-picker-list" class="smart-picker-list"></nav>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button type="button" id="lb-close" class="icon-btn lb-close" aria-label="Close">✕</button>
    <div id="lb-stage" class="lb-stage"></div>
    <div id="lb-meta" class="lb-meta"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
